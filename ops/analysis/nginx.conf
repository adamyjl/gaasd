location = /analysis {
    limit_req zone=gaasd_stats burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 15s;
}
location ^~ /analysis/ {
    limit_req zone=gaasd_stats burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 15s;
}
