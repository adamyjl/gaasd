# Append this block at the END of sshd_config, after global directives.
# BEGIN GAASD PRO6000 TUNNEL
Match User gaasd-pro6000-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    PermitListen 127.0.0.1:2226
    PermitOpen none
    GatewayPorts no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 0
# END GAASD PRO6000 TUNNEL
