# Merge into the OTHER computer's ~/.ssh/config.
# Replace id_rsa if its matching private key has a different filename.
# Verify server host key fingerprints on first connection.
Host gaasd-tencent
    HostName 49.232.60.144
    Port 22
    User ubuntu
    IdentityFile ~/.ssh/id_rsa
    IdentitiesOnly yes
    ServerAliveInterval 15
    ServerAliveCountMax 3

Host tsari-via-cloud
    HostName 127.0.0.1
    Port 2223
    User user001
    ProxyJump gaasd-tencent
    HostKeyAlias 192.168.1.111
    IdentityFile ~/.ssh/id_rsa
    IdentitiesOnly yes
    ServerAliveInterval 15
    ServerAliveCountMax 3

