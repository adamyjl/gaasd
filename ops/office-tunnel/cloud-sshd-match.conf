# Append this block at the END of sshd_config, after global directives.
# BEGIN GAASD OFFICE TUNNEL
Match User gaasd-office-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    PermitListen 127.0.0.1:2222 127.0.0.1:18765
    PermitOpen none
    GatewayPorts no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 0
# END GAASD OFFICE TUNNEL
