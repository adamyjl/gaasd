# Included only in the gaasd.com HTTPS server. No new public ports.
location = /status2 {
    return 308 /status2/;
}

location = /_gaasd_status2_auth {
    internal;
    # Existing /status returns 200 only after the shared Basic-auth check.
    # Reuse the original password hash and realm; never duplicate credentials.
    proxy_pass http://127.0.0.1:4180/status;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /status2/ {
    limit_req zone=gaasd_stats burst=30 nodelay;
    limit_req_status 429;
    auth_request /_gaasd_status2_auth;
    limit_except GET { deny all; }

    # A trailing slash removes /status2/ before forwarding to the existing app.
    proxy_pass http://127.0.0.1:18765/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8765;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_buffering off;
    proxy_redirect off;

    # This read-only app uses absolute asset and API paths. Adapt responses
    # only here, preserving its existing local/LAN URLs and source files.
    sub_filter_once off;
    sub_filter_types text/javascript application/javascript;
    sub_filter 'href="/' 'href="/status2/';
    sub_filter 'src="/' 'src="/status2/';
    sub_filter "api('/api/" "api('/status2/api/";

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # Inline styles are used by this existing dashboard's meters and charts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    error_page 502 504 =503 @gaasd_status2_unavailable;
}

location @gaasd_status2_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 503 '{"error":"Office monitor unavailable; the direct SSH tunnel will reconnect automatically."}';
}
